# Test Configuration: isolated in-memory test profile
spring.application.name=CodeMind-Test

# In-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Dummy AI configs for test context
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.openai.api-key=test-dummy-key
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.base-url=https://api.openai.com
spring.ai.openai.embedding.api-key=test-dummy-key
spring.ai.openai.embedding.model=jina-embeddings-v3
spring.ai.openai.embedding.dimensions=1024

codemind.rerank.enabled=false
codemind.qdrant.host=localhost
codemind.qdrant.port=6334
